name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      # GameTests run headless on the dedicated-gameTestServer run type. AE2 is a runtimeOnly dependency of the dev
      # runs, so the ME interop tests execute for real here as well.
      - name: GameTests
        run: ./gradlew runGameTestServer --stacktrace

      - name: Upload build artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-container-jars
          path: build/libs/*.jar
          if-no-files-found: ignore
